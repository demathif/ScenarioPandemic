<!doctype html>
<html lang="fr">
	<head>
		<title>Scénarios Pandémie</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<link rel="icon" href="../images/survival.ico" />
		<link rel="stylesheet" href="../style/style.css">
		<script type="text/javascript" src="../assets/cards.js?v=3"></script>
		<script type="text/javascript" src="../assets/prepare.js?v=3"></script>
	</head>
	
	<body onload="run();">
		<header>
			🎲 Scénario Pandemic — Sélection des personnages
		</header>

		<div class="section-action">
			<p style="text-align:center; font-size:var(--font-size-lg);">
				Choisissez <strong>0, 1 ou 2 personnages</strong>, puis cliquez sur <strong>Start</strong>.
				<br/>
				<span style="font-size:var(--font-size-sm); color:var(--color-text-light);">
					Les personnages non choisis seront attribués aléatoirement.
				</span>
			</p>
			<form id="idBoxes" name="thisForm">
				<!-- La grille des personnages est générée ici par prepare.js -->
			</form>
			<div style="text-align:center; margin-top:var(--spacing-lg);">
				<button type="button" onclick="get_roles(document.thisForm);" class="primary" style="font-size:var(--font-size-lg); padding:var(--spacing-md) var(--spacing-xl);">
					🎮 Start
				</button>
			</div>
		</div>

		<div class="section-action">
			<a href="https://docs.google.com/spreadsheets/d/1zwSPXdVmSMyLT-hhdvtLy0Kp2LJ_qGabPaC65YANEVw/edit?gid=0#gid=0" target="_blank">📊 Lien des précédentes parties</a>
		</div>
		
		<footer>
			v0.9.0<br />
			Author : Potaw (CDM 2019 avec Yo)
		</footer>
	</body>
</html>
